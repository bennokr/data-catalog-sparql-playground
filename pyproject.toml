[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-catalog-sparql-playground"
version = "0.2.0"
description = "Build a static in-browser SPARQL playground from RDF files"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Benno Kruit" }]
dependencies = []

[project.scripts]
make-catalog = "make_catalog:main"

[tool.setuptools]
py-modules = ["make_catalog"]
