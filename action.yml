name: Build SPARQL playground
description: Build a static in-browser SPARQL site from RDF data and example queries

inputs:
  data:
    description: Newline-separated RDF file patterns relative to the consumer repository
    required: true
  queries:
    description: Newline-separated SPARQL query patterns relative to the consumer repository
    required: false
    default: ""
  title:
    description: Site and catalog title
    required: false
    default: SPARQL playground
  variant:
    description: Interface variant, either minimal or advanced
    required: false
    default: minimal
  output:
    description: Output directory
    required: false
    default: _site
  source-root:
    description: Directory containing consumer data, relative to the workspace
    required: false
    default: .
  base-url:
    description: Base URL written to catalog.json; relative URLs work on project Pages sites
    required: false
    default: ./
  license:
    description: Optional license URL applied to each dataset
    required: false
    default: ""

outputs:
  site-path:
    description: Directory containing the generated static site
    value: ${{ steps.build.outputs.site-path }}

runs:
  using: composite
  steps:
    - id: build
      name: Build static site
      shell: bash
      env:
        PLAYGROUND_DATA: ${{ inputs.data }}
        PLAYGROUND_QUERIES: ${{ inputs.queries }}
        PLAYGROUND_TITLE: ${{ inputs.title }}
        PLAYGROUND_VARIANT: ${{ inputs.variant }}
        PLAYGROUND_OUTPUT: ${{ inputs.output }}
        PLAYGROUND_SOURCE_ROOT: ${{ inputs.source-root }}
        PLAYGROUND_BASE_URL: ${{ inputs.base-url }}
        PLAYGROUND_LICENSE: ${{ inputs.license }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r pattern; do
          if [[ -n "$pattern" ]]; then
            args+=(--data "$pattern")
          fi
        done <<< "$PLAYGROUND_DATA"
        while IFS= read -r pattern; do
          if [[ -n "$pattern" ]]; then
            args+=(--queries "$pattern")
          fi
        done <<< "$PLAYGROUND_QUERIES"
        if [[ -n "$PLAYGROUND_LICENSE" ]]; then
          args+=(--license "$PLAYGROUND_LICENSE")
        fi
        command=(
          python3 "$GITHUB_ACTION_PATH/make_catalog.py" build
          --source-root "$GITHUB_WORKSPACE/$PLAYGROUND_SOURCE_ROOT"
          --template "$GITHUB_ACTION_PATH/data-catalog-sparql-playground"
          --output "$PLAYGROUND_OUTPUT"
          --name "$PLAYGROUND_TITLE"
          --variant "$PLAYGROUND_VARIANT"
          --base-url "$PLAYGROUND_BASE_URL"
        )
        command+=("${args[@]}")
        "${command[@]}"
        echo "site-path=$PLAYGROUND_OUTPUT" >> "$GITHUB_OUTPUT"
